# À chaque push sur master : construit organum.com et remplace la
# publication « rolling » (étiquette déplacée sur le nouveau commit).
name: rolling

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling
  cancel-in-progress: true

jobs:
  # Le helper macOS est un Mach-O hors chaîne cosmocc : il se construit sur
  # un runner macOS avec clang + codesign + lipo seulement (ni cosmocc ni le
  # moteur). Il est ensuite récupéré par la construction Linux pour être
  # embarqué dans organum.com. La signature ad-hoc est obligatoire : macOS
  # arm64 refuse d'exécuter un Mach-O non signé.
  assistant-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construire et signer le helper universel
        run: sh plateforme/macos/construire_assistant.sh

      - name: Vérifier architectures et signature
        run: |
          test -x plateforme/macos/build/organum-helper
          lipo -info plateforme/macos/build/organum-helper
          codesign --verify --strict plateforme/macos/build/organum-helper
          codesign -dv plateforme/macos/build/organum-helper

      - name: Publier le helper
        uses: actions/upload-artifact@v4
        with:
          name: organum-helper
          path: plateforme/macos/build/organum-helper
          if-no-files-found: error
          retention-days: 7

  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Le job Linux attend le helper macOS, mais doit continuer même si celui-ci
    # a échoué : organum.com reste alors constructible, sans assistant natif.
    needs: assistant-macos
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      # Absent (job macOS en échec, ou premier essai) n'est pas fatal ;
      # build.sh avertit alors et produit organum.com sans helper.
      - name: Récupérer l'assistant macOS
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: organum-helper
          path: plateforme/macos/build

      - name: Vérifier l'assistant macOS
        run: |
          if [ -s plateforme/macos/build/organum-helper ]; then
            echo "assistant macOS récupéré ($(wc -c < plateforme/macos/build/organum-helper) octets)"
          else
            echo "::warning::assistant macOS absent ; organum.com sera construit sans helper natif macOS"
          fi

      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools zip luarocks liblua5.1-0-dev libasound2-dev
          sudo luarocks install moonscript

      # La chaîne cosmocc se construit depuis l'arbre cosmopolitan corrigé :
      # long (environ une heure), d'où le cache, invalidé quand le commit ou
      # le correctif changent.
      - name: Cache cosmocc
        uses: actions/cache@v4
        with:
          path: |
            externe/cosmocc
          key: cosmocc-${{ hashFiles('scripts/dependances.sh', 'cosmo/cosmopolitan.patch') }}

      - name: Construction
        run: scripts/construire.sh

      - name: Tests
        run: scripts/tester.sh

      - name: Vérification
        run: |
          test -s web/build/organum.com
          unzip -l web/build/organum.com | grep -q '\.init\.lua'
          if [ -s plateforme/macos/build/organum-helper ]; then
            unzip -l web/build/organum.com | grep -q '\.organum/organum-helper'
          fi

      # Sur une branche (workflow_dispatch, par exemple la validation macOS),
      # la construction et les tests servent à vérifier, sans remplacer la
      # publication « rolling » qui doit rester adossée à master.
      - name: Publication rolling
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rolling --yes --cleanup-tag || true
          gh release create rolling web/build/organum.com \
            --target "$GITHUB_SHA" --prerelease \
            --title "organum (rolling)" \
            --notes "Construction automatique du commit $GITHUB_SHA. Linux x86-64 : chmod +x organum.com && ./organum.com puis http://localhost:8080"
